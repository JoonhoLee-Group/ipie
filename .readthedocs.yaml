# Read the Docs configuration, see https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  builder: html
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements_rtd.txt
    # Install ipie so autodoc can import every module; optional heavy
    # dependencies are mocked in conf.py.
    - method: pip
      path: .
